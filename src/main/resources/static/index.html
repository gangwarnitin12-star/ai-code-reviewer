<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Code Reviewer</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header>

    <div class="brand">
        🤖 AI Code Reviewer
    </div>

    <div class="status">
        ● System Online
    </div>

</header>


<section class="hero">

    <h1>
        Java Code Review,
        <span>Step by Step.</span>
    </h1>

    <p>
        First compile your Java code.
        If compilation passes, the reviewer checks
        bugs, security and code quality.
    </p>

</section>


<section class="card">

    <label>Java Source Code</label>

    <textarea id="code" placeholder="Paste Java code here...">public class Main {
    public static void main(String[] args) {
        int a = 10;
        int b = 0;
        System.out.println(a / b);
    }
}</textarea>

    <button id="reviewBtn" onclick="reviewCode()">
        ▶ Review Code
    </button>

</section>


<section id="result" class="result hidden">

    <div id="compilerBox" class="resultBox">
    </div>

    <div id="analysisBox" class="resultBox hidden">
    </div>

    <div id="reviewBox" class="resultBox hidden">
    </div>

</section>


<footer>

    AI Code Reviewer • Java • Spring Boot • GitHub Integration

</footer>

</div>


<script>
async function reviewCode() {

    const code = document.getElementById("code").value;
    const btn = document.getElementById("reviewBtn");
    const result = document.getElementById("result");
    const compilerBox = document.getElementById("compilerBox");
    const analysisBox = document.getElementById("analysisBox");
    const reviewBox = document.getElementById("reviewBox");

    if (!code.trim()) {
        alert("Please enter Java code.");
        return;
    }

    btn.disabled = true;
    btn.textContent = "⏳ Compiling...";

    result.classList.remove("hidden");
    analysisBox.classList.add("hidden");
    reviewBox.classList.add("hidden");

    try {

        const response = await fetch("/review", {
            method: "POST",
            headers: {
                "Content-Type": "text/plain"
            },
            body: code
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (data.compiled === true) {

            compilerBox.className = "resultBox success";

            compilerBox.innerHTML =
                "<h3>✅ Java Compiler</h3>" +
                "<p>" + escapeHtml(data.compilerMessage) + "</p>";

            analysisBox.className = "resultBox analysis";

            analysisBox.innerHTML =
                "<h3>🤖 AI Analysis</h3>" +
                "<p>" + escapeHtml(data.aiAnalysis) + "</p>";

            analysisBox.classList.remove("hidden");

            reviewBox.className = "resultBox review";

            reviewBox.innerHTML =
                "<h3>🔍 Review Results</h3>" +
                "<pre>" + escapeHtml(data.review || "") + "</pre>";

            reviewBox.classList.remove("hidden");

        } else {

            compilerBox.className = "resultBox error";

            const errors =
                (data.compilerErrors || []).join("\n");

            compilerBox.innerHTML =
                "<h3>❌ Java Compiler</h3>" +
                "<p>" + escapeHtml(data.compilerMessage || "") + "</p>" +
                "<pre>" + escapeHtml(errors) + "</pre>";
        }

    } catch (error) {

        compilerBox.className = "resultBox error";

        compilerBox.innerHTML =
            "<h3>❌ Request Error</h3>" +
            "<p>" + escapeHtml(error.message) + "</p>";

    } finally {

        btn.disabled = false;
        btn.textContent = "▶ Review Code";
    }
}

function escapeHtml(value) {

    return String(value).replace(
        /[&<>"']/g,
        function (character) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[character];

        }
    );
}
</script>

</body>
</html>
